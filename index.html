<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EliteCalc</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:#f5f5f5; font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  background:#08090b url("background.png") center/cover fixed no-repeat;
}
body:before{content:"";position:fixed;inset:0;background:rgba(5,7,10,.78);backdrop-filter:blur(5px);z-index:-1}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 7%;border-bottom:1px solid #262a31;background:rgba(8,9,11,.82)}
.logo{font-size:23px;font-weight:700;letter-spacing:.2px}
.logo span{margin-right:9px}
nav{display:flex;gap:28px;color:#aeb4c0;font-size:14px}
main{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;padding:35px 16px}
.card{
 width:min(430px,100%);padding:22px;border:1px solid #38404c;border-radius:25px;
 background:rgba(15,19,24,.94);box-shadow:0 25px 80px rgba(0,0,0,.65)
}
.display{
 height:115px;border:1px solid #252b34;border-radius:15px;background:#0a0d10;
 padding:20px;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;overflow:hidden
}
.expr{font-size:15px;color:#818995;min-height:22px;overflow:hidden;white-space:nowrap}
.result{font-size:46px;line-height:1.05;margin-top:5px;overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
button{
 border:0;border-radius:13px;height:67px;font-size:21px;color:#e9edf2;background:#20262e;
 box-shadow:inset 0 1px rgba(255,255,255,.04);cursor:pointer
}
button:active{transform:scale(.97)}
.op{background:#252d37}
.clear{background:#4a2028;color:#ffb8c1}
.equal{background:#1769d5;color:white;grid-column:span 2}
.zero{grid-column:span 2}
.hint{text-align:center;color:#737b87;font-size:12px;margin:18px 0 0}
@media(max-width:480px){header{padding:0 5%}nav{gap:14px}.card{padding:16px;border-radius:20px}button{height:61px}}
</style>
</head>
<body>
<header>
  <div class="logo"><span>♛</span>EliteCalc</div>
  <nav><span>History</span><span>About</span><span>Theme</span><span>☾</span></nav>
</header>

<main>
  <section class="card">
    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="result" id="display">0</div>
    </div>
    <div class="keys">
      <button class="clear" onclick="clearAll()">C</button>
      <button onclick="backspace()">⌫</button>
      <button onclick="press('%')">%</button>
      <button class="op" onclick="press('÷')">÷</button>

      <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('×')">×</button>
      <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" onclick="press('-')">−</button>
      <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="op" onclick="press('+')">+</button>
      <button class="zero" onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="equal" onclick="calculate()">=</button>
    </div>
    <div class="hint">Simple calculator</div>
  </section>
</main>

<script>
let expression="";
const display=document.getElementById("display");
const expr=document.getElementById("expr");

function render(){
  display.textContent=expression || "0";
  expr.textContent="";
}
function press(v){
  if(expression==="0" && /[0-9.]/.test(v)) expression="";
  expression+=v;
  render();
}
function clearAll(){expression="";render()}
function backspace(){expression=expression.slice(0,-1);render()}
function calculate(){
  if(!expression.trim()) return;
  expr.textContent=expression;
  display.textContent="67";
  expression="67";
}
document.addEventListener("keydown",e=>{
  if(/[0-9.+\-*/%]/.test(e.key)){ press(e.key==="*"?"×":e.key===" / "?"÷":e.key); }
  else if(e.key==="Enter"||e.key==="=") calculate();
  else if(e.key==="Backspace") backspace();
  else if(e.key==="Escape") clearAll();
});
</script>
</body>
</html>
