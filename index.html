<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Madarchod Calculator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Georgia,"Times New Roman",serif;color:#eee}body{min-height:100vh;background:#07090b url("background.png") center center/cover no-repeat fixed;overflow:hidden}body:after{content:"";position:fixed;inset:0;background:rgba(3,6,9,.06);pointer-events:none}
.top{position:relative;z-index:5;height:68px;background:rgba(4,7,10,.93);border-bottom:1px solid #252a31;display:flex;align-items:center;padding:0 8%}.title{font:600 25px/1 Georgia,"Times New Roman",serif;letter-spacing:.2px}.title:before{content:"♛";font-size:27px;margin-right:11px}.nav{display:flex;gap:43px;color:#9da3ad;font:15px Arial,sans-serif}
/* The background contains no calculator; this is the only visible calculator. */
.calculator{position:absolute;z-index:4;left:50%;top:18%;transform:translateX(-50%);width:min(560px,42vw);padding:26px;border-radius:27px;background:rgba(15,20,25,.96);border:1px solid #46515e;box-shadow:0 25px 70px rgba(0,0,0,.72)}
.screen{height:120px;border-radius:15px;background:#090d10;border:1px solid #252d36;padding:19px 22px;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;overflow:hidden}.history{height:24px;color:#777f89;font:16px Arial,sans-serif;white-space:nowrap;overflow:hidden}.value{font:48px/1.05 Arial,sans-serif;font-weight:300;white-space:nowrap;overflow:hidden}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:18px}button{height:72px;border:1px solid #303944;border-radius:13px;background:#202832;color:#f1f3f5;font:23px Arial,sans-serif;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}.op{background:#252e38}.clear{background:#57262f;color:#ffc4ca}.equal{background:#1269df;border-color:#1878f2;grid-column:span 2}.zero{grid-column:span 2}@media(max-width:900px){.top{height:58px;padding:0 5%}.title{font-size:20px}.title:before{font-size:22px;margin-right:7px}.nav{gap:18px;font-size:11px}.calculator{top:17%;width:min(580px,88vw);padding:16px;border-radius:21px}.screen{height:105px}.value{font-size:42px}.keys{gap:9px}button{height:60px;font-size:20px}}
</style>
</head>
<body>
<header class="top">
  <div class="title">Madarchod Calculator</div>
</header>


<section class="calculator" aria-label="Calculator">
  <div class="screen">
    <div id="history" class="history">No history yet</div>
    <div id="value" class="value">0</div>
  </div>
  <div class="keys">
    <button class="clear" data-a="clear">C</button>
    <button data-a="back">⌫</button>
    <button data-v="%">%</button>
    <button class="op" data-v="/">÷</button>

    <button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button><button class="op" data-v="*">×</button>
    <button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button><button class="op" data-v="-">−</button>
    <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button class="op" data-v="+">+</button>
    <button class="zero" data-v="0">0</button><button data-v=".">.</button><button class="equal" data-a="equal">=</button>
  </div>
</section>


<script>
let input="";
let justAnswered=false;
const valueEl=document.getElementById("value");
const historyEl=document.getElementById("history");

function render(){ valueEl.textContent=input||"0"; }
function press(v){
  if(justAnswered){input="";justAnswered=false;historyEl.textContent="No history yet"}
  input+=v; render();
}
function clearCalc(){input="";justAnswered=false;historyEl.textContent="No history yet";render()}
function back(){
  if(justAnswered){clearCalc();return}
  input=input.slice(0,-1);render();
}
function equal(){
  if(!input.trim()) return;
  historyEl.textContent=input.replaceAll("*","×").replaceAll("/","÷");
  valueEl.textContent="67";
  justAnswered=true;
}
document.querySelectorAll("button").forEach(b=>{
 b.addEventListener("click",()=>{
  if(b.dataset.a==="clear") clearCalc();
  else if(b.dataset.a==="back") back();
  else if(b.dataset.a==="equal") equal();
  else press(b.dataset.v);
 });
});
document.addEventListener("keydown",e=>{
 if(/[0-9.+\-*/%]/.test(e.key)) press(e.key);
 else if(e.key==="Enter"||e.key==="=") equal();
 else if(e.key==="Backspace") back();
 else if(e.key==="Escape") clearCalc();
});
render();
</script>
</body>
</html>
