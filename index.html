<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>67 Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0b0b0f;
      color: #f5f5f7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .calculator {
      width: min(100%, 390px);
      background: #17171d;
      border: 1px solid #303039;
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand h1 { margin: 0; font-size: 20px; }
    .badge {
      background: #25252e;
      border: 1px solid #3b3b47;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .display {
      background: #0e0e13;
      border: 1px solid #2d2d36;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;
      text-align: right;
      overflow: hidden;
    }
    #expression {
      min-height: 24px;
      color: #9999a6;
      font-size: 15px;
      overflow-wrap: anywhere;
    }
    #result {
      margin-top: 4px;
      font-size: 44px;
      font-weight: 800;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }
    button {
      min-height: 58px;
      border: 1px solid #353540;
      border-radius: 15px;
      background: #22222a;
      color: #fff;
      font-size: 20px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(.97); }
    button.operator, button.equals {
      background: #30303a;
    }
    button.clear {
      background: #292933;
    }
    .zero { grid-column: span 2; }
    .hint {
      margin: 13px 4px 2px;
      text-align: center;
      color: #858591;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="67 Calculator">
    <div class="brand">
      <h1>67 Calculator</h1>
      <div class="badge">EVERYTHING = 67</div>
    </div>

    <div class="display">
      <div id="expression" aria-live="polite">0</div>
      <div id="result" aria-live="assertive">67</div>
    </div>

    <div class="keys">
      <button class="clear" data-action="clear">AC</button>
      <button data-value="(">(</button>
      <button data-value=")">)</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>

    <div class="hint">
      Enter literally any equation. The scientifically questionable answer is always 67.
    </div>
  </main>

  <script>
    (() => {
      const expression = document.getElementById("expression");
      const result = document.getElementById("result");
      let input = "";

      function render() {
        expression.textContent = input || "0";
        result.textContent = "67";
      }

      document.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          const action = button.dataset.action;
          const value = button.dataset.value;

          if (action === "clear") {
            input = "";
          } else if (action === "equals") {
            result.textContent = "67";
          } else if (value !== undefined && input.length < 120) {
            input += value;
          }

          render();
        });
      });

      document.addEventListener("keydown", event => {
        const allowed = "0123456789.+-*/()";
        if (allowed.includes(event.key) && input.length < 120) {
          input += event.key;
          render();
        } else if (event.key === "Enter") {
          event.preventDefault();
          result.textContent = "67";
        } else if (event.key === "Escape") {
          input = "";
          render();
        } else if (event.key === "Backspace") {
          input = input.slice(0, -1);
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
